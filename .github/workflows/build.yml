name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare project
        run: |
          shopt -s nullglob
          mkdir -p work
          # find every .zip anywhere in the repo (sorted), unzip in order
          find . -type f -iname '*.zip' -not -path './work/*' -not -path './.git/*' | sort | while read -r z; do
            echo "Unzipping $z"
            unzip -q -o "$z" -d work
          done
          # loose files go on top
          if [ -d extra ]; then cp -a extra/. work/; fi
          S=$(find work -maxdepth 4 -name 'settings.gradle*' | head -1)
          if [ -z "$S" ]; then echo "error: no settings.gradle found. Check your zips or file paths"; exit 1; fi
          echo "Building from: $(dirname "$S")"
          echo "DIR=$(dirname "$S")" >> $GITHUB_ENV
      - name: Build APK
        run: cd "$DIR" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "work/**/build/outputs/apk/debug/app-debug.apk"
